name: Deploy to Cloudflare

# 推送即部署：前端构建产物 + Worker 代码一起上线。
# 首次使用需在仓库 Settings → Secrets and variables → Actions 里配置两个 secret：
#   CLOUDFLARE_API_TOKEN   在 Cloudflare 控制台 My Profile → API Tokens 创建（模板选 Edit Cloudflare Workers）
#   CLOUDFLARE_ACCOUNT_ID  86b6a024ae88dffb3c7315b3fcbef40e
# 未配置时本流水线会输出提示并跳过部署，不会失败。

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      sync_data:
        description: 同时把 cloudflare/db/seed.sql 同步到线上 D1（只覆盖参考数据，不动饮食记录）
        type: boolean
        default: false

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 未配置密钥时说明原因
        if: env.CF_API_TOKEN == ''
        run: |
          echo "::notice title=已跳过部署::仓库未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次只做构建校验。"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 安装 Worker 依赖
        if: env.CF_API_TOKEN != ''
        working-directory: cloudflare
        run: npm ci

      - name: 部署 Worker 与静态资源
        if: env.CF_API_TOKEN != ''
        working-directory: cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: 同步参考数据到 D1
        if: github.event_name == 'workflow_dispatch' && inputs.sync_data && env.CF_API_TOKEN != ''
        working-directory: cloudflare
        run: npx wrangler d1 execute nutrition-system-db --remote --file=db/seed.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: 输出访问地址
        if: env.CF_API_TOKEN != ''
        run: echo "::notice title=部署完成::https://nutrition-system.nutrimap.workers.dev"
