services:
  api:
    build:
      context: ..
      dockerfile: tencent/Dockerfile.api
    image: nutrition-system-api:local
    container_name: nutrition-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      Nutrition__DatabasePath: /app/data/data.db
      Cors__AllowedOrigins__0: ${SITE_ORIGIN:-http://localhost}
    volumes:
      - nutrition-data:/app/data
    networks:
      - nutrition-net

  web:
    build:
      context: ..
      dockerfile: tencent/Dockerfile.web
      args:
        VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-}
    image: nutrition-system-web:local
    container_name: nutrition-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - nutrition-net

volumes:
  nutrition-data:

networks:
  nutrition-net:
